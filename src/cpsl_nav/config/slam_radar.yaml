slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Ceres Solver Parameters
    ceres_solver_options:
      num_threads: 2

    # ROS Parameters
    odom_frame: cpsl_ugv_1/odom
    map_frame: map
    base_frame: cpsl_ugv_1/base_link
    scan_topic: scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.8   # Slightly slower updates to let the solver stabilize
    resolution: 0.1            
    max_laser_range: 10.0
    minimum_time_interval: 0.05
    transform_timeout: 0.5     
    tf_buffer_duration: 30.
    stack_size_to_use: 2000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    scan_buffer_size: 70       
    scan_buffer_maximum_scan_distance: 10.0
    
    # --- STRICTOR LOOP CLOSURE LIMITS ---
    link_match_minimum_response_fine: 0.25  # Increased from 0.05
    link_scan_maximum_distance: 2.0         # Tightened from 4.0 to prevent "wild" jumps
    loop_search_maximum_distance: 10.0      
    do_loop_closing: true
    loop_match_minimum_chain_size: 10        # Increased from 3 (requires 10 consistent matches)
    loop_match_maximum_variance_coarse: 3.0 # Reduced from 5.0 (less permissive of "fuzzy" matches)
    loop_match_minimum_response_coarse: 0.25 # Increased from 0.1
    loop_match_minimum_response_fine: 0.35   # Increased from 0.15

    # Correlation Parameters - Local
    correlation_search_space_dimension: 2.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure
    loop_search_space_dimension: 20.0      
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.1 

    # Scan Matcher Parameters
    # Bringing these back up slightly so Odom acts as a "sanity check"
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.5

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349      # Tightened from 0.6
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.1             # Restored some "trust" to Odom
    minimum_distance_penalty: 0.1           # Restored some "trust" to Odom
    use_response_expansion: true